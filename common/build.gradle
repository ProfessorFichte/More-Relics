architectury {
    common rootProject.enabled_platforms.split(',')
}

// Dummy platform for common compile
def platform = "fabric";

repositories {
    maven { url 'https://maven.kosmx.dev/' }
    maven { url 'https://maven.shedaniel.me/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven { url 'https://maven.fabricmc.net' }
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$project.fabric_loader_version"
    // There is no Forgified Fabric API on the 1.20.1 line: common/ must stay Fabric-API-free.
    // Everything Fabric-API-shaped (datagen) lives in fabric/ instead.

    modImplementation("me.shedaniel.cloth:cloth-config-${platform}:${project.cloth_config_version}")
    // Ecosystem libraries with a 1.20.1 release: resolved from the Modrinth maven. Modrinth serves only
    // the per-loader jars, so `common` keeps compiling against the `-fabric` flavour it already took.
    modImplementation("maven.modrinth:tiny-config:${project.tiny_config_version}-${platform}") { transitive = false }

    modImplementation("maven.modrinth:spell-power:${project.spell_power_version}-${platform}") { transitive = false }
    modImplementation("maven.modrinth:spell-engine:${project.spell_engine_version}-${platform}") { transitive = false }
    modImplementation("maven.modrinth:relics-rpg:${project.relics_version}-${platform}") { transitive = false }
    // More RPG Library resolves once its 1.20.1 release is published (Fichte release tier 1).
    modImplementation("maven.modrinth:more-rpg-library:${project.more_rpg_library_version}-${platform}") { transitive = false }
}
